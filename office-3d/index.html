<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Message Flow</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1420; font-family: system-ui, sans-serif; }
  #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

  /* Small HTML overlay: title, hint and floor buttons. */
  #hud {
    position: absolute; top: 14px; left: 14px; color: #dfe6f3;
    background: rgba(15, 20, 32, .72); padding: 10px 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; max-width: 320px;
  }
  #hud h1 { font-size: 15px; margin: 0 0 4px; }
  #hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #hud button {
    background: #1f2a40; color: #dfe6f3; border: 1px solid #34425f; border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer;
  }
  #hud button.on { background: #3d6cf0; border-color: #3d6cf0; }
  /* Shown instead of a blank screen if the 3D view can't start. */
  #startupError {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    color: #dfe6f3; background: #0f1420; font-size: 15px; line-height: 1.5; text-align: center;
  }
  #startupError[hidden] { display: none; }
  #startupError div { max-width: 460px; }
  #startupError code { display: block; margin-top: 10px; color: #ff8a80; font-size: 13px; white-space: pre-wrap; text-align: left; }
  .key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 8px; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="startupError" hidden><div>
  <strong id="startupErrorTitle">The 3D view couldn't start.</strong>
  <p id="startupErrorHelp"></p>
  <code id="startupErrorDetail"></code>
</div></div>

<script>
/* =====================================================================
   0. STARTUP — load Babylon.js, and show a readable message if anything fails.
   ===================================================================== */

// Some embedded viewers and previews provide a cut-down console (e.g. no
// console.info). Fill in any missing methods so logging can never stop the page.
(function safeConsole() {
  try {
    if (typeof window.console !== "object" || !window.console) window.console = {};
    const fallback = typeof console.log === "function" ? console.log.bind(console) : function () {};
    ["log", "info", "warn", "error", "debug"].forEach(name => {
      if (typeof console[name] !== "function") console[name] = fallback;
    });
  } catch (e) { /* console is read-only here; nothing more we can do */ }
})();

// Some embedded viewers forbid gamepad access, and then navigator.getGamepads()
// throws instead of returning a list. Babylon calls it while setting up input
// in new BABYLON.Scene(), which would stop the page, so report "no gamepads".
(function safeGamepads() {
  try {
    if (typeof navigator.getGamepads === "function") navigator.getGamepads();
  } catch (e) {
    try {
      Object.defineProperty(navigator, "getGamepads", { value: () => [], configurable: true });
    } catch (e2) { /* can't override here; startup will report the error */ }
  }
})();

// Babylon.js core + GUI, pinned to one version. The Babylon CDN (the one the
// Playground uses) is tried first; the others host identical files and are
// only used if it's blocked or unreachable.
const BABYLON_VERSION = "9.30.0";
const BABYLON_CORE_URLS = [
  `https://cdn.babylonjs.com/v${BABYLON_VERSION}/babylon.js`,
  `https://cdn.jsdelivr.net/npm/babylonjs@${BABYLON_VERSION}/babylon.js`,
  `https://unpkg.com/babylonjs@${BABYLON_VERSION}/babylon.js`,
];
const BABYLON_GUI_URLS = [
  `https://cdn.babylonjs.com/v${BABYLON_VERSION}/gui/babylon.gui.min.js`,
  `https://cdn.jsdelivr.net/npm/babylonjs-gui@${BABYLON_VERSION}/babylon.gui.min.js`,
  `https://unpkg.com/babylonjs-gui@${BABYLON_VERSION}/babylon.gui.min.js`,
];
const SCRIPT_TIMEOUT_MS = 15000;

// Load one script tag; resolves when it has run, rejects on error or timeout.
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    const timer = setTimeout(() => {
      tag.remove();
      reject(new Error(`timed out after ${SCRIPT_TIMEOUT_MS / 1000}s`));
    }, SCRIPT_TIMEOUT_MS);
    tag.src = url;
    tag.onload  = () => { clearTimeout(timer); resolve(); };
    tag.onerror = () => { clearTimeout(timer); tag.remove(); reject(new Error("blocked or unreachable")); };
    document.head.appendChild(tag);
  });
}

// Log without ever throwing, even if the console is missing or stubbed.
function safeLog(level, message) {
  try { (console[level] || console.log)(message); } catch (e) { /* ignore */ }
}

// Try each URL in order until one loads and defines what we need.
// Only a failed download or a missing global counts as a failure.
async function loadFirstWorking(label, urls, isReady) {
  const failures = [];
  for (const url of urls) {
    if (isReady()) return;   // already available (e.g. an earlier source worked)
    try {
      await loadScript(url);
    } catch (err) {
      safeLog("error", `[office-3d] ${label} failed to load from ${url}: ${err.message}`);
      failures.push(`${url} (${err.message})`);
      continue;
    }
    if (isReady()) {
      safeLog("info", `[office-3d] ${label} loaded from ${url}`);
      return;
    }
    const reason = "loaded, but didn't define what we need";
    safeLog("error", `[office-3d] ${label} failed to load from ${url}: ${reason}`);
    failures.push(`${url} (${reason})`);
  }
  throw new Error(`${label} could not be loaded from any source:\n` + failures.join("\n"));
}

// Resolves once both Babylon core and Babylon GUI are ready to use.
async function loadBabylon() {
  await loadFirstWorking("Babylon.js", BABYLON_CORE_URLS, () => typeof BABYLON !== "undefined");
  await loadFirstWorking("Babylon GUI", BABYLON_GUI_URLS, () => !!(window.BABYLON && BABYLON.GUI));
}

function showStartupError(title, help, detail) {
  document.getElementById("startupErrorTitle").textContent = title;
  document.getElementById("startupErrorHelp").textContent = help;
  document.getElementById("startupErrorDetail").textContent = detail || "";
  document.getElementById("startupError").hidden = false;
}
window.addEventListener("error", e => {
  if (!document.getElementById("startupError").hidden) return;   // keep the first, most specific message
  const msg = String(e.message || e.error || "Unknown error");
  if (/WebGL/i.test(msg)) {
    showStartupError("This browser can't draw 3D graphics.",
      "WebGL is turned off or unavailable. Try Chrome, Edge or Firefox, and check hardware acceleration is switched on in the browser settings.", msg);
  } else {
    showStartupError("The 3D view hit an error while starting.", "The message below says what went wrong.", msg);
  }
});
</script>

<script>

// Floor heights. Add another entry to add a floor.

const FLOOR_SIZE  = { width: 30, depth: 17 };  // slab size (x, z)

const LINE_Y      = 0.04;    // floor guide lines sit just above the floor

// Departments. x/z = room centre, w/d = room size, floor = FLOORS level.
// processEvery = seconds the team takes to clear one queued item.
const DEPARTMENTS = [
  // ---- Ground floor ----
  { id: "reception",  name: "Reception",   floor: 0, x: -10, z:  4.2, w: 7, d: 5, color: "#e0b04c", processEvery: 5 },

  // ---- First floor ----
  { id: "sales",      name: "Sales",            floor: 1, x: -11, z:  4.2, w: 5, d: 5, color: "#4da3ff", processEvery: 6 },
  { id: "marketing",  name: "Marketing",        floor: 1, x:  -5, z:  4.2, w: 5, d: 5, color: "#e36bb5", processEvery: 8 },
  { id: "legal",      name: "Legal",            floor: 1, x:   1, z:  4.2, w: 5, d: 5, color: "#8f9bb3", processEvery: 12 },
  { id: "ops",        name: "Operations",       floor: 1, x:   7, z:  4.2, w: 5, d: 5, color: "#f2c94c", processEvery: 7 },
  { id: "service",    name: "Customer Service", floor: 1, x: -11, z: -4.2, w: 5, d: 5, color: "#56ccf2", processEvery: 6 },
  { id: "projects",   name: "Projects",         floor: 1, x:  -5, z: -4.2, w: 5, d: 5, color: "#a0d468", processEvery: 9 },
  { id: "directors",  name: "Directors",        floor: 1, x:   1, z: -4.2, w: 5, d: 5, color: "#ff8c42", processEvery: 11 },

// Sample messages, grouped by the department they are sent TO.
// from = sending department id. Add, remove or edit lines freely.
// When a department clears a message it goes back in the outbox and is
// sent again later, so the building keeps moving with the same content.
const SAMPLE_MESSAGES = {
  reception: [
    { from: "sales",      text: "Client from Harlow & Co arriving 10:30, meeting room 2", urgent: false },
    { from: "hr",         text: "Two interview candidates at 2pm, send them up to HR",    urgent: false },

  ],
  post: [

    { from: "marketing",  text: "200 brochures to post to the trade show list",           urgent: false },

  ],
  it: [

  ],
  accounts: [

    { from: "sales",      text: "Expense claim: client lunch £86.20",                     urgent: false },

    { from: "facilities", text: "Cleaning contract renewal, £1,150/month",                urgent: false },
  ],
  hr: [
    { from: "service",    text: "Holiday request: Amy R., 12–16 Aug",                     urgent: false },
    { from: "ops",        text: "Sick note received for Dan K. (3 days)",                 urgent: false },
    { from: "directors",  text: "Offer letter for Head of Sales role",                    urgent: true },
  ],
  facilities: [
    { from: "accounts",   text: "Heating not working in Accounts",                        urgent: true },
    { from: "reception",  text: "Light out above main entrance",                          urgent: false },
    { from: "projects",   text: "Move 4 desks to first floor by Thursday",                urgent: false },
  ],
  sales: [
    { from: "reception",  text: "Call back Mark at Kestrel Hotels re: quote",             urgent: false },
    { from: "service",    text: "Customer wants to upgrade to annual plan",               urgent: false },
    { from: "marketing",  text: "12 new leads from Tuesday's webinar",                    urgent: false },
  ],
  marketing: [
    { from: "sales",      text: "Updated price sheet needed for brochure",                urgent: false },
    { from: "directors",  text: "Approve press release before 4pm",                       urgent: true },
    { from: "projects",   text: "Case study photos from the Leeds project",               urgent: false },
  ],
  legal: [
    { from: "sales",      text: "Review Harlow & Co contract, red-lined v3",              urgent: true },
    { from: "hr",         text: "NDA for new contractor",                                 urgent: false },
    { from: "service",    text: "Customer data access request (GDPR), 30-day deadline",   urgent: false },
  ],
  ops: [
    { from: "facilities", text: "Stationery stock low: paper, toner",                     urgent: false },
    { from: "projects",   text: "Supplier delivery delayed to next week",                 urgent: true },
    { from: "hr",         text: "Rota change: cover needed Saturday",                     urgent: false },
  ],
  service: [
    { from: "reception",  text: "Unhappy caller, order #8812 not arrived",                urgent: true },
    { from: "sales",      text: "Refund approved for invoice #4390",                      urgent: false },
    { from: "ops",        text: "Tracking numbers for today's dispatches",                urgent: false },
  ],
  projects: [
    { from: "directors",  text: "Sign-off needed: phase 2 milestone",                     urgent: false },
    { from: "sales",      text: "Client asking to add a second site to scope",            urgent: false },
    { from: "it",         text: "Server migration window: Sunday 6am",                    urgent: false },
  ],
  directors: [
    { from: "accounts",   text: "Q3 budget pack for sign-off",                            urgent: true },
    { from: "hr",         text: "Hiring approval: 2 x customer service roles",            urgent: false },
    { from: "projects",   text: "Board paper draft for review",                           urgent: false },
  ],
};

// People and timing. Every "[min, max]" is a random range, so no two
// people move, pause or set off in step.
const SEND_GAP         = [0.2, 1.4];   // seconds between people setting off
const RESEND_DELAY     = [2, 9];       // a cleared message waits this long before going out again
const WALK_SPEED       = [1.6, 3.0];   // each person's own walking pace (world units per second)
const URGENT_HURRY     = 1.35;         // urgent messages walk this much faster
const PERSON_SCALE     = 1.3;          // size of the little people (1 = about a third of room height)
const DOOR_PAUSE       = [0.3, 1.4];   // pause at the door before going in
const CHAT_CHANCE      = 0.2;          // chance of stopping for a chat on the way
const CHAT_PAUSE       = [1, 3];       // how long a chat lasts
const WORK_JITTER      = [0.7, 1.3];   // each clear takes processEvery x a value in this range
const SKIN_TONES       = ["#f1c7a5", "#e2b08a", "#c68b62", "#9a6544", "#6e4730"];
const BUSY_THRESHOLD   = 6;     // rooms glow red at this queue length
const LABEL_MAX_ITEMS  = 8;     // items listed in the click label

const COLORS = {
  urgent:   "#ff5a4d",
  line:     "#5b6b8c",
  stair:    "#8aa0c8",
  slab:     "#1c2436",
  busy:     "#ff3b30",
};

// Everything below needs Babylon, so it only runs once loadBabylon() has finished.
function startOffice() {

  /* =====================================================================
     2. SCENE SETUP — engine, camera, lights, shadows, GUI layer.
     ===================================================================== */

  const canvas = document.getElementById("renderCanvas");
  let engine;
  try {
    engine = new BABYLON.Engine(canvas, true, { stencil: true });
  } catch (err) {
    showStartupError("This browser can't draw 3D graphics.",
      "WebGL is turned off or unavailable. Try Chrome, Edge or Firefox, and check hardware acceleration is switched on in the browser settings.",
      String(err && err.message || err));
    throw err;
  }
  const scene  = new BABYLON.Scene(engine);
  scene.clearColor = BABYLON.Color4.FromHexString("#0f1420ff");

  // Orbit camera aimed at the middle of the building.
  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 3, Math.PI / 3.2, 42,
    new BABYLON.Vector3(0, 3, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 15;
  camera.upperRadiusLimit = 80;
  camera.upperBetaLimit = Math.PI / 2.05;   // don't go under the ground
  camera.wheelPrecision = 20;

  // Soft lighting: a cool sky fill so nothing goes black, plus a warm sun for shape.
  const sky = new BABYLON.HemisphericLight("sky", new BABYLON.Vector3(0.2, 1, 0.1), scene);
  sky.intensity   = 0.6;
  sky.diffuse     = BABYLON.Color3.FromHexString("#e6ecfa");
  sky.groundColor = BABYLON.Color3.FromHexString("#2a3248");

  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.45, -1, -0.35), scene);
  sun.position  = new BABYLON.Vector3(20, 40, 16);
  sun.intensity = 0.95;
  sun.diffuse   = BABYLON.Color3.FromHexString("#fff1de");
  sun.autoCalcShadowZBounds = true;   // fit the shadow depth range to the scene, or most shadows get clipped

  // Soft-edged shadows from the sun. Anything passed to castShadow() throws one.
  const shadows = new BABYLON.ShadowGenerator(2048, sun);
  shadows.usePercentageCloserFiltering = true;
  shadows.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
  shadows.bias = 0.0015;
  shadows.normalBias = 0.02;
  shadows.darkness = 0.35;            // 0 = black shadows, 1 = none; keep them gentle
  const castShadow = mesh => shadows.addShadowCaster(mesh, false);

  // Filmic tone mapping gives softer highlights and richer colour.
  scene.imageProcessingConfiguration.toneMappingEnabled = true;
  scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
  scene.imageProcessingConfiguration.exposure = 1.2;

  // Full-screen 2D layer for room names and the click label.
  const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("ui", true, scene);

  // Small helper: a matte material, cached by key. `glow` lifts it slightly out of shadow.
  const materialCache = {};
  function matteMaterial(key, hex, glow = 0.06, alpha = 1) {
    if (materialCache[key]) return materialCache[key];
    const m = new BABYLON.StandardMaterial(key, scene);
    const c = BABYLON.Color3.FromHexString(hex);
    m.diffuseColor  = c;
    m.emissiveColor = c.scale(glow);
    m.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);
    m.alpha = alpha;
    materialCache[key] = m;
    return m;
  }

  // Mix a colour towards a light grey (amount 0..1), for floors in a department's tint.
  const tint = (hex, amount) => BABYLON.Color3.Lerp(
    BABYLON.Color3.FromHexString(hex), BABYLON.Color3.FromHexString("#e9ecf2"), amount).toHexString();

  /* =====================================================================
     3. BUILDING — room sizes, walls, furniture, stairs and corridor plants.
     ===================================================================== */

  // Building settings (kept here, next to the code that uses them).
  const ROOM_SIZE    = { minWidth: 4.4, maxWidth: 8, minDepth: 4.2, maxDepth: 6.2 };  // quietest -> busiest
  const ROOM_AREA_X  = [-14.6, 9.4];   // rooms fill this stretch; the stair hall is beyond it
  const ROOM_START_Z = 1.8;            // rooms start this far either side of the corridor centre
  const ROOM_GAP     = 0.5;            // space between neighbouring rooms
  const WALL_HEIGHT  = 1.4;            // low "cutaway" walls so you can see in from above
  const WALL_THICK   = 0.12;
  const DOOR_WIDTH   = 1.3;
  const DESK         = { width: 1.1, depth: 0.6, gap: 0.12 };
  const ROW_PITCH    = 1.85;           // aisle + desk + chair, front to back
  const SPINE_HALF   = 0.6;            // half-width of the clear walkway from the door to the back
  const STAIRS       = { x: 12, width: 2, fromZ: -6, toZ: 6, steps: 20 };   // ground at fromZ, first floor at toZ
  const FURNITURE    = { desk: "#c9a77c", monitor: "#1c2130", plant: "#3f8f5a", pot: "#8a6a50",
                         stairs: "#3a455f", corridor: "#252e45" };

  const V3 = (x, y, z) => new BABYLON.Vector3(x, y, z);
  const rand = (min, max) => min + Math.random() * (max - min);
  const randIn = range => rand(range[0], range[1]);

  // One parent node per floor, so a whole floor can be hidden at once.
  const floorNodes = FLOORS.map(f => new BABYLON.TransformNode("floor" + f.level, scene));
  const floorY = level => FLOORS[level].y;

  // ---- Room sizes from busyness ---------------------------------------
  // Busyness = messages sent to the department x seconds it takes to clear one.
  // The busiest room gets ROOM_SIZE.max*, the quietest ROOM_SIZE.min*.
  // Each room's x in DEPARTMENTS sets its order along the corridor, and the
  // sign of its z sets which side of the corridor it's on.
  const busynessOf = d => (SAMPLE_MESSAGES[d.id] || []).length * d.processEvery;
  (function sizeAndPlaceRooms() {
    const loads = DEPARTMENTS.map(busynessOf);
    const lo = Math.min(...loads), hi = Math.max(...loads);
    DEPARTMENTS.forEach((d, i) => {
      const t = hi > lo ? (loads[i] - lo) / (hi - lo) : 0.5;
      d.busyness = loads[i];
      d.side = d.z >= CORRIDOR_Z ? 1 : -1;
      d.w = ROOM_SIZE.minWidth + t * (ROOM_SIZE.maxWidth - ROOM_SIZE.minWidth);
      d.d = ROOM_SIZE.minDepth + t * (ROOM_SIZE.maxDepth - ROOM_SIZE.minDepth);
    });
    // Each side of each floor is one row of rooms, squeezed if it's too long, then centred.
    FLOORS.forEach(f => [1, -1].forEach(side => {
      const row = DEPARTMENTS.filter(d => d.floor === f.level && d.side === side).sort((a, b) => a.x - b.x);
      if (!row.length) return;
      const gaps = ROOM_GAP * (row.length - 1);
      const total = row.reduce((sum, d) => sum + d.w, 0);
      const squeeze = Math.min(1, (ROOM_AREA_X[1] - ROOM_AREA_X[0] - gaps) / total);
      let x = (ROOM_AREA_X[0] + ROOM_AREA_X[1]) / 2 - (total * squeeze + gaps) / 2;
      row.forEach(d => {
        d.w *= squeeze;
        d.x = x + d.w / 2;
        d.z = side * (ROOM_START_Z + d.d / 2);
        x += d.w + ROOM_GAP;
      });
    }));
  })();

  // Inside a room, "u" is the distance in from the door wall (the corridor side).
  const inwardOf  = d => d.side;
  const doorWallZ = d => d.z - inwardOf(d) * d.d / 2;
  const roomPoint = (d, x, u) => V3(x, floorY(d.floor), doorWallZ(d) + inwardOf(d) * u);
  const uOf       = (d, p) => (p.z - doorWallZ(d)) * inwardOf(d);

  // ---- Floors -----------------------------------------------------------
  // Slabs, with a darker runner marking the corridor. Upper floors are see-through.
  FLOORS.forEach(f => {
    const alpha = f.level === 0 ? 1 : 0.35;
    const slab = BABYLON.MeshBuilder.CreateBox("slab" + f.level,
      { width: FLOOR_SIZE.width, depth: FLOOR_SIZE.depth, height: 0.15 }, scene);
    slab.position.y = f.y - 0.08;
    slab.material = matteMaterial("slab" + f.level, COLORS.slab, 0.1, alpha);
    slab.receiveShadows = true;
    slab.isPickable = false;
    slab.parent = floorNodes[f.level];

    const runner = BABYLON.MeshBuilder.CreateBox("corridor" + f.level,
      { width: FLOOR_SIZE.width - 0.6, depth: ROOM_START_Z * 2 - 0.2, height: 0.02 }, scene);
    runner.position.set(0, f.y + 0.01, CORRIDOR_Z);
    runner.material = matteMaterial("corridor" + f.level, FURNITURE.corridor, 0.1, alpha);
    runner.receiveShadows = true;
    runner.isPickable = false;
    runner.parent = floorNodes[f.level];
  });

  // ---- Furniture shapes ---------------------------------------------------
  // Built once, hidden, then stamped into rooms as instances (cheap to draw).
  function part(w, h, d, x, y, z) {
    const b = BABYLON.MeshBuilder.CreateBox("part", { width: w, height: h, depth: d }, scene);
    b.position.set(x, y, z);
    return b;
  }
  function shape(name, parts, material) {
    const mesh = BABYLON.Mesh.MergeMeshes(parts, true);
    mesh.name = name;
    mesh.material = material;
    mesh.isPickable = false;
    mesh.receiveShadows = true;
    mesh.isVisible = false;           // the template stays hidden; its instances are drawn
    return mesh;
  }
  function stamp(template, parent, position, rotationY = 0) {
    const inst = template.createInstance(template.name + "-i");
    inst.position.copyFrom(position);
    inst.rotation.y = rotationY;
    inst.isPickable = false;
    inst.parent = parent;
    castShadow(inst);                 // a hidden template casts nothing, so each instance is added
    return inst;
  }

  // Desk: top, two side panels and a modesty panel. The chair side is local -z.
  const deskShape = shape("desk", [
    part(DESK.width, 0.05, DESK.depth, 0, 0.46, 0),
    part(0.05, 0.44, DESK.depth - 0.04, -DESK.width / 2 + 0.05, 0.22, 0),
    part(0.05, 0.44, DESK.depth - 0.04,  DESK.width / 2 - 0.05, 0.22, 0),
    part(DESK.width - 0.1, 0.28, 0.03, 0, 0.28, DESK.depth / 2 - 0.04),
  ], matteMaterial("desk", FURNITURE.desk));

  // Monitor on a stand, facing the chair.
  const monitorShape = shape("monitor", [
    part(0.46, 0.28, 0.03, 0, 0.7, 0.12),
    part(0.06, 0.16, 0.06, 0, 0.55, 0.13),
    part(0.2, 0.02, 0.14, 0, 0.495, 0.13),
  ], matteMaterial("monitor", FURNITURE.monitor, 0.15));

  // Chair, centred on its own origin, back towards local -z. One per department colour.
  const chairShapes = {};
  function chairShape(d) {
    if (!chairShapes[d.id]) {
      const dark = BABYLON.Color3.FromHexString(d.color).scale(0.55).toHexString();
      chairShapes[d.id] = shape("chair-" + d.id, [
        part(0.42, 0.06, 0.42, 0, 0.3, 0),
        part(0.42, 0.36, 0.05, 0, 0.53, -0.19),
        part(0.06, 0.27, 0.06, 0, 0.14, 0),
        part(0.36, 0.03, 0.36, 0, 0.015, 0),
      ], matteMaterial("chair-" + d.id, dark));
    }
    return chairShapes[d.id];
  }

  // Plant: a pot and a leafy top.
  const potShape = shape("pot", [BABYLON.MeshBuilder.CreateCylinder("p",
    { height: 0.32, diameterTop: 0.34, diameterBottom: 0.26, tessellation: 12 }, scene)],
    matteMaterial("pot", FURNITURE.pot));
  potShape.bakeTransformIntoVertices(BABYLON.Matrix.Translation(0, 0.16, 0));
  const leavesShape = shape("leaves", [BABYLON.MeshBuilder.CreateSphere("p",
    { diameter: 0.62, segments: 8 }, scene)], matteMaterial("leaves", FURNITURE.plant, 0.08));
  leavesShape.bakeTransformIntoVertices(BABYLON.Matrix.Scaling(1, 1.2, 1).multiply(BABYLON.Matrix.Translation(0, 0.66, 0)));
  function placePlant(parent, position) {
    const turn = rand(0, Math.PI * 2);
    stamp(potShape, parent, position, turn);
    const leaves = stamp(leavesShape, parent, position, turn);
    leaves.scaling.setAll(rand(0.85, 1.15));
  }

  // ---- Rooms --------------------------------------------------------------
  // Each room: tinted floor, solid walls in the department colour with a doorway,
  // desks in rows around a clear walkway, and an invisible box that takes clicks.
  const rooms = {};   // id -> { dept, hit, wallMat, baseColor, anchor, nameTag, queue, doorX, spots }

  DEPARTMENTS.forEach((d, index) => {
    const y = floorY(d.floor), parent = floorNodes[d.floor], inward = inwardOf(d);
    const baseColor = BABYLON.Color3.FromHexString(d.color);
    const x0 = d.x - d.w / 2, x1 = d.x + d.w / 2;

    // Door: nudged off-centre by a different amount per room, so rooms differ.
    const doorX = d.x + [0, -0.22, 0.22][index % 3] * (d.w - DOOR_WIDTH - 1);

    const floor = BABYLON.MeshBuilder.CreateBox(d.id + "-floor", { width: d.w, depth: d.d, height: 0.04 }, scene);
    floor.position.set(d.x, y + 0.025, d.z);
    floor.material = matteMaterial(d.id + "-floor", tint(d.color, 0.62), 0.08);
    floor.receiveShadows = true;
    floor.isPickable = false;
    floor.parent = parent;

    // Walls: opaque, in the department colour. Its own material so it can glow when busy.
    const wallMat = new BABYLON.StandardMaterial(d.id + "-walls", scene);
    wallMat.diffuseColor  = baseColor;
    wallMat.emissiveColor = baseColor.scale(0.08);
    wallMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    const wall = (name, w, depth, x, z) => {
      if (w <= 0.01) return;
      const m = BABYLON.MeshBuilder.CreateBox(d.id + "-" + name, { width: w, height: WALL_HEIGHT, depth }, scene);
      m.position.set(x, y + WALL_HEIGHT / 2, z);
      m.material = wallMat;
      m.receiveShadows = true;
      m.isPickable = false;
      m.parent = parent;
      castShadow(m);
    };
    const zDoor = doorWallZ(d), zBack = d.z + inward * d.d / 2;
    const leftLen = doorX - DOOR_WIDTH / 2 - x0, rightLen = x1 - (doorX + DOOR_WIDTH / 2);
    wall("back",    d.w + WALL_THICK, WALL_THICK, d.x, zBack);
    wall("left",    WALL_THICK, d.d, x0, d.z);
    wall("right",   WALL_THICK, d.d, x1, d.z);
    wall("front-l", leftLen,  WALL_THICK, x0 + leftLen / 2,  zDoor);
    wall("front-r", rightLen, WALL_THICK, x1 - rightLen / 2, zDoor);

    // Desks: rows across the room, each with an aisle in front of it. The walkway
    // around doorX is kept clear. Busier (bigger) rooms get more rows and desks.
    const deskTurn = inward > 0 ? Math.PI : 0;     // chair side faces into the room
    const aisles = [];
    for (let u = 0.75; u + 1.55 <= d.d - 0.1; u += ROW_PITCH) {
      aisles.push(u);
      const deskU = u + 0.35 + DESK.depth / 2;
      [[x0 + WALL_THICK + 0.35, doorX - SPINE_HALF], [doorX + SPINE_HALF, x1 - WALL_THICK - 0.35]].forEach(([a, b]) => {
        const n = Math.floor((b - a + DESK.gap) / (DESK.width + DESK.gap));
        if (n < 1) return;
        let x = (a + b) / 2 - (n * DESK.width + (n - 1) * DESK.gap) / 2 + DESK.width / 2;
        for (let k = 0; k < n; k++, x += DESK.width + DESK.gap) {
          stamp(deskShape, parent, roomPoint(d, x, deskU), deskTurn);
          stamp(monitorShape, parent, roomPoint(d, x, deskU), deskTurn);
          stamp(chairShape(d), parent, roomPoint(d, x + rand(-0.12, 0.12), deskU + 0.6 + rand(-0.05, 0.08)),
            deskTurn + rand(-0.35, 0.35));
        }
      });
    }

    // A plant in the front corner away from the door.
    const plantX = doorX < d.x ? x1 - 0.45 : x0 + 0.45;
    placePlant(parent, roomPoint(d, plantX, 0.42));

    // Places people stand while waiting: along the aisles, clear of the walkway,
    // the walls and the plant. Front of the queue stands deepest in the room.
    const spots = [];
    aisles.forEach(u => {
      for (let x = x0 + 0.85; x <= x1 - 0.85; x += 0.62) {
        if (Math.abs(x - doorX) < 0.5) continue;
        if (Math.abs(x - plantX) < 0.8 && u < 1) continue;
        spots.push(roomPoint(d, x, u));
      }
    });
    if (!spots.length) spots.push(roomPoint(d, doorX, 0.9));
    spots.sort((a, b) => uOf(d, b) - uOf(d, a) || Math.abs(a.x - doorX) - Math.abs(b.x - doorX));

    // Invisible box covering the room: this is what a click hits.
    const hit = BABYLON.MeshBuilder.CreateBox(d.id + "-hit", { width: d.w, depth: d.d, height: WALL_HEIGHT + 0.4 }, scene);
    hit.position.set(d.x, y + (WALL_HEIGHT + 0.4) / 2, d.z);
    hit.isVisible = false;
    hit.metadata = { deptId: d.id };   // used by the click handler
    hit.parent = parent;

    // Invisible point above the room that the 2D labels follow.
    const anchor = new BABYLON.TransformNode(d.id + "-anchor", scene);
    anchor.position.set(d.x, y + WALL_HEIGHT + 0.6, d.z);
    anchor.parent = parent;

    // Always-on room name.
    const nameTag = new BABYLON.GUI.TextBlock(d.id + "-name", d.name);
    nameTag.color = "#ffffff";
    nameTag.fontSize = 13;
    nameTag.outlineWidth = 3;
    nameTag.outlineColor = "#0f1420";
    nameTag.resizeToFit = true;
    ui.addControl(nameTag);
    nameTag.linkWithMesh(anchor);

    rooms[d.id] = { dept: d, hit, wallMat, baseColor, anchor, nameTag, queue: [], doorX, spots };
  });

  // ---- Corridor plants ------------------------------------------------------
  // Along the corridor edges, never in front of a doorway.
  FLOORS.forEach(f => {
    [-13, -8.5, -4, 0.5, 5, 8.8].forEach((x, i) => {
      const side = i % 2 ? 1 : -1;
      const blocked = DEPARTMENTS.some(d => d.floor === f.level && d.side === side &&
        Math.abs(rooms[d.id].doorX - x) < DOOR_WIDTH);
      if (!blocked) placePlant(floorNodes[f.level], V3(x, f.y, CORRIDOR_Z + side * 1.45));
    });
  });

  // ---- Stairs ---------------------------------------------------------------
  // Open-tread stairs in the hall beyond the rooms, from the ground floor at
  // STAIRS.fromZ up to the first floor at STAIRS.toZ.
  const rise = (floorY(1) - floorY(0)) / STAIRS.steps;
  const run  = (STAIRS.toZ - STAIRS.fromZ) / STAIRS.steps;
  const stepShape = shape("step", [part(STAIRS.width, rise * 0.6, run * 1.05, 0, 0, 0)],
    matteMaterial("stairs", FURNITURE.stairs, 0.1));
  for (let i = 0; i < STAIRS.steps; i++) {
    stamp(stepShape, null, V3(STAIRS.x, floorY(0) + rise * (i + 0.7), STAIRS.fromZ + run * (i + 0.5)));
  }
  const slope = Math.atan2(floorY(1) - floorY(0), STAIRS.toZ - STAIRS.fromZ);
  const stringerLen = Math.hypot(floorY(1) - floorY(0), STAIRS.toZ - STAIRS.fromZ);
  [-1, 1].forEach(s => {
    const stringer = BABYLON.MeshBuilder.CreateBox("stringer", { width: 0.08, height: 0.3, depth: stringerLen }, scene);
    stringer.position.set(STAIRS.x + s * (STAIRS.width / 2 + 0.04), (floorY(0) + floorY(1)) / 2 + 0.15, (STAIRS.fromZ + STAIRS.toZ) / 2);
    stringer.rotation.x = -slope;
    stringer.material = matteMaterial("stairs", FURNITURE.stairs, 0.1);
    stringer.isPickable = false;
    castShadow(stringer);
  });

  /* =====================================================================
     4. MESSAGES — people carrying messages: routes, walking, queues.
     ===================================================================== */

  const travelling = [];   // people currently walking a message somewhere
  const leaving = [];      // people whose message was cleared, walking out and fading
  let messageCounter = 0;
  let clock = 0;           // seconds since start (paused time doesn't count)

  // ---- People --------------------------------------------------------

  // Shared shapes, cloned for each person (cheap: clones share geometry).
  const bodyShape = BABYLON.MeshBuilder.CreateCapsule("bodyShape",
    { height: 0.62, radius: 0.15, tessellation: 12, subdivisions: 1 }, scene);
  const headShape = BABYLON.MeshBuilder.CreateSphere("headShape", { diameter: 0.26, segments: 10 }, scene);
  const markShape = BABYLON.MeshBuilder.CreateSphere("markShape", { diameter: 0.13, segments: 8 }, scene);
  [bodyShape, headShape, markShape].forEach(m => { m.isPickable = false; m.setEnabled(false); });

  // A small person: body in the department colour, a head, and a red marker if urgent.
  function createPerson(deptColor, urgent) {
    const root = new BABYLON.TransformNode("person" + messageCounter, scene);
    root.scaling.setAll(PERSON_SCALE);
    const piece = (source, y, material) => {
      const m = source.clone(source.name + messageCounter, root);
      m.setEnabled(true);
      m.position.y = y;
      m.material = material;
      castShadow(m);
      return m;
    };
    const body = piece(bodyShape, 0.31, matteMaterial("body-" + deptColor, deptColor, 0.15));
    const tone = SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)];
    const head = piece(headShape, 0.76, matteMaterial("skin-" + tone, tone, 0.15));
    const mark = urgent ? piece(markShape, 1.06, matteMaterial("urgent-mark", COLORS.urgent, 0.7)) : null;
    return { root, body, head, mark, parts: [body, head, mark].filter(Boolean) };
  }

  function disposePerson(m) {
    m.person.parts.forEach(p => shadows.removeShadowCaster(p, false));
    m.person.root.dispose();
  }

  // ---- Routes --------------------------------------------------------
  // A route is first a few control points, then smoothed into a curve.
  // Control points marked `hard` (doorways, stair ends) or with a pause
  // are passed through exactly; everything between them is curved.

  const lane = () => CORRIDOR_Z + rand(-CORRIDOR_HALF_WIDTH, CORRIDOR_HALF_WIDTH) * 0.85;
  const doorInside  = room => roomPoint(room.dept, room.doorX + rand(-0.15, 0.15), 0.35);
  const doorOutside = room => roomPoint(room.dept, room.doorX + rand(-0.2, 0.2), -0.6);
  const randomSpot  = room => room.spots[Math.floor(Math.random() * room.spots.length)]
    .add(V3(rand(-0.15, 0.15), 0, rand(-0.1, 0.1)));

  // Inside a room: along the aisle to the walkway, along the walkway, then
  // along the other aisle. Never through a desk.
  function roomRoute(room, a, b) {
    const d = room.dept, spineX = room.doorX + rand(-0.12, 0.12);
    const ua = uOf(d, a), ub = uOf(d, b);
    const pts = [a];
    if (Math.abs(ua - ub) > 0.3) {
      if (Math.abs(a.x - spineX) > 0.25) pts.push(roomPoint(d, spineX, ua));
      if (Math.abs(b.x - spineX) > 0.25) pts.push(roomPoint(d, spineX, ub));
    }
    pts.push(b);
    return pts;
  }

  // Turn control points into a smooth walk: { p, pause } points close together.
  function smoothRoute(ctrl) {
    const out = [];
    let leg = [ctrl[0].p];
    const flush = pause => {
      const pts = leg.length >= 3 ? BABYLON.Curve3.CreateCatmullRomSpline(leg, 8, false).getPoints() : leg;
      pts.forEach((p, i) => { if (!(out.length && i === 0)) out.push({ p, pause: 0 }); });
      out[out.length - 1].pause = pause;
    };
    for (let i = 1; i < ctrl.length; i++) {
      if (BABYLON.Vector3.DistanceSquared(ctrl[i].p, leg[leg.length - 1]) < 0.0004) continue;
      leg.push(ctrl[i].p);
      if (ctrl[i].pause > 0 || ctrl[i].hard || i === ctrl.length - 1) {
        flush(ctrl[i].pause || 0);
        leg = [ctrl[i].p];
      }
    }
    if (!out.length) out.push({ p: ctrl[0].p, pause: 0 });
    return out;
  }
  const asCtrl = pts => pts.map(p => ({ p, pause: 0 }));

  // A whole trip, different every time: from a desk in the sending room, out
  // of the door, wandering down the corridor (maybe stopping to chat), up or
  // down the stairs if needed, a pause at the door, then in.
  function routeBetween(from, to) {
    const fr = rooms[from.id], tr = rooms[to.id];
    const fy = floorY(from.floor), ty = floorY(to.floor);
    const ctrl = [];
    const add = (p, pause = 0, hard = false) => ctrl.push({ p, pause, hard });

    roomRoute(fr, randomSpot(fr), doorInside(fr)).forEach(p => add(p));
    ctrl[ctrl.length - 1].hard = true;
    add(doorOutside(fr), 0, true);

    // 1-2 loose waypoints along the corridor, each in its own lane.
    const wander = (y, xa, xb) => {
      const stops = 1 + Math.floor(Math.random() * 2);
      for (let i = 1; i <= stops; i++) {
        const t = i / (stops + 1) + rand(-0.12, 0.12);
        add(V3(xa + (xb - xa) * t, y, lane()), Math.random() < CHAT_CHANCE ? randIn(CHAT_PAUSE) : 0);
      }
    };

    add(V3(fr.doorX + rand(-0.6, 0.6), fy, lane()));
    if (from.floor === to.floor) {
      wander(fy, fr.doorX, tr.doorX);
    } else {
      // Into the stair hall, round to the foot (or head) of the stairs, climb, and back.
      const up = to.floor > from.floor;
      const hallX = ROOM_AREA_X[1] + 0.9;
      const sx = STAIRS.x + rand(-STAIRS.width / 2 + 0.35, STAIRS.width / 2 - 0.35);
      const foot = V3(sx, floorY(0), STAIRS.fromZ - 0.45), head = V3(sx, floorY(1), STAIRS.toZ + 0.45);
      const endZ = up ? STAIRS.fromZ : STAIRS.toZ, startZ = up ? STAIRS.toZ : STAIRS.fromZ;
      wander(fy, fr.doorX, hallX);
      add(V3(hallX + rand(0, 0.5), fy, CORRIDOR_Z + Math.sign(endZ) * rand(1.8, 3)));
      add(V3(hallX + rand(0.2, 0.6), fy, endZ + Math.sign(endZ) * rand(0.8, 1.2)));
      add(up ? foot : head, 0, true);
      add(up ? head : foot, 0, true);
      add(V3(hallX + rand(0.2, 0.6), ty, startZ + Math.sign(startZ) * rand(0.8, 1.2)));
      add(V3(hallX + rand(0, 0.5), ty, CORRIDOR_Z + Math.sign(startZ) * rand(1.8, 3)));
      wander(ty, hallX, tr.doorX);
    }
    add(V3(tr.doorX + rand(-0.6, 0.6), ty, lane()));
    add(doorOutside(tr), randIn(DOOR_PAUSE), true);
    add(doorInside(tr), 0, true);
    return smoothRoute(ctrl);
  }

  // ---- Messages ------------------------------------------------------

  // Build a message (a person + their route) from a sample entry.
  function createMessage(sample) {
    const from = rooms[sample.from].dept, to = rooms[sample.to].dept;
    const person = createPerson(from.color, sample.urgent);
    const path = routeBetween(from, to);
    person.root.position.copyFrom(path[0].p);

    return {
      id: ++messageCounter,
      sample,            // the original entry, re-sent after it's cleared
      from, to,
      urgent: sample.urgent,
      text: sample.text,
      person, path,
      segment: 0,        // index of the path point we're walking from
      along: 0,          // distance travelled towards the next point
      wait: 0,           // seconds left in a pause
      speed: randIn(WALK_SPEED) * (sample.urgent ? URGENT_HURRY : 1),
      phase: Math.random() * Math.PI * 2,   // offsets bobbing and pace drift
      step: Math.random() * Math.PI * 2,    // walking-cycle position
      spotIndex: null,   // which waiting spot they have in the room
      spot: null,
      lookAt: Math.random() * Math.PI * 2,  // direction they face while standing
      nextGlance: rand(1, 5),
    };
  }

  // Messages waiting to be sent: { sample, readyAt }.
  const outbox = [];
  let nextSendIn = randIn(SEND_GAP);

  // Send a random ready message on its way (random pick, so the order never repeats).
  function spawnMessage() {
    const ready = outbox.filter(o => o.readyAt <= clock);
    if (!ready.length) return;
    const pickOne = ready[Math.floor(Math.random() * ready.length)];
    outbox.splice(outbox.indexOf(pickOne), 1);
    const m = createMessage(pickOne.sample);
    travelling.push(m);
    if (openLabelFor === m.to.id) renderLabel(rooms[m.to.id]);   // show it as incoming
  }

  // Turn SAMPLE_MESSAGES into messages: half start waiting in their room,
  // the rest go in the outbox and set off at scattered times.
  function seedQueues() {
    let n = 0;
    Object.entries(SAMPLE_MESSAGES).forEach(([toId, list]) => {
      list.forEach(entry => {
        const sample = { ...entry, to: toId };
        if (!rooms[toId] || !rooms[sample.from]) {
          console.warn("SAMPLE_MESSAGES: unknown department in", sample);
          return;
        }
        if (n++ % 2 === 0) arrive(createMessage(sample), true);
        else outbox.push({ sample, readyAt: rand(0, 12) });
      });
    });
  }

  // ---- Movement and animation ------------------------------------------

  // Shortest signed angle from a to b, so turning never spins the long way round.
  const angleDelta = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

  // Turn a person smoothly towards a heading.
  function turnTowards(m, heading, dt, rate = 8) {
    const r = m.person.root.rotation;
    r.y += angleDelta(r.y, heading) * Math.min(1, dt * rate);
  }

  // Walking animation: a little bob and sway in time with their steps.
  function animateWalk(m, dt, speed) {
    m.step += dt * speed * 5.5;
    const bob = Math.abs(Math.sin(m.step)) * 0.045;
    m.person.body.position.y = 0.31 + bob;
    m.person.head.position.y = 0.76 + bob;
    m.person.body.rotation.z = Math.sin(m.step) * 0.07;
    if (m.person.mark) m.person.mark.position.y = 1.06 + bob;
  }

  // Standing still: slow breathing, an occasional glance around.
  function animateIdle(m, dt) {
    const breathe = Math.sin(clock * 1.6 + m.phase) * 0.012;
    m.person.body.position.y = 0.31 + breathe;
    m.person.head.position.y = 0.76 + breathe;
    m.person.body.rotation.z *= 0.9;
    m.nextGlance -= dt;
    if (m.nextGlance <= 0) {
      m.lookAt += rand(-1.3, 1.3);
      m.nextGlance = rand(2, 6);
    }
    turnTowards(m, m.lookAt, dt, 2.5);
  }

  // Pulse the urgent marker so it catches the eye.
  function animateMark(m) {
    if (m.person.mark) m.person.mark.scaling.setAll(1 + Math.sin(clock * 6 + m.phase) * 0.18);
  }

  // Walk a person along m.path. Returns true once they reach the end.
  function followPath(m, dt, speed) {
    if (m.wait > 0) { m.wait -= dt; animateIdle(m, dt); return false; }
    const path = m.path, pos = m.person.root.position;
    let step = speed * dt;
    while (step > 0 && m.segment < path.length - 1) {
      const a = path[m.segment].p, b = path[m.segment + 1].p;
      const left = BABYLON.Vector3.Distance(a, b) - m.along;
      if (step < left) { m.along += step; step = 0; }
      else {
        step -= left; m.segment++; m.along = 0;
        if (path[m.segment].pause > 0) {        // stop here for a moment
          m.wait = path[m.segment].pause;
          pos.copyFrom(path[m.segment].p);
          return false;
        }
      }
    }
    if (m.segment >= path.length - 1) { pos.copyFrom(path[path.length - 1].p); return true; }
    const a = path[m.segment].p, b = path[m.segment + 1].p;
    BABYLON.Vector3.LerpToRef(a, b, m.along / (BABYLON.Vector3.Distance(a, b) || 1), pos);
    turnTowards(m, Math.atan2(b.x - a.x, b.z - a.z), dt);
    animateWalk(m, dt, speed);
    return false;
  }

  // Start someone on a new walk.
  function setPath(m, ctrl, delay = 0) {
    m.path = smoothRoute(ctrl);
    m.segment = 0;
    m.along = 0;
    m.wait = delay;
  }

  // Move every person who is out delivering a message.
  function moveMessages(dt) {
    for (let i = travelling.length - 1; i >= 0; i--) {
      const m = travelling[i];
      animateMark(m);
      // Each person's pace drifts a little, like someone walking naturally.
      const speed = m.speed * (1 + 0.15 * Math.sin(clock * 0.8 + m.phase));
      if (followPath(m, dt, speed)) {
        travelling.splice(i, 1);
        arrive(m);
      }
    }
  }

  // A message reached its room: join the queue (urgent ones go to the front).
  // `instant` places them straight on their spot (used when seeding).
  function arrive(m, instant = false) {
    const room = rooms[m.to.id];
    if (m.urgent) {
      const firstNormal = room.queue.findIndex(q => !q.urgent);
      room.queue.splice(firstNormal === -1 ? room.queue.length : firstNormal, 0, m);
    } else {
      room.queue.push(m);
    }
    m.person.root.parent = floorNodes[m.to.floor];   // hide with its floor
    m.path = null;
    layoutQueue(room, instant ? m : null);
    refreshRoom(room);
  }

  // Give everyone in the room a standing spot in an aisle. Anyone whose spot
  // changed walks there along the aisles, after a short, personal delay.
  function layoutQueue(room, placeNow = null) {
    const d = room.dept, n = room.spots.length;
    room.queue.forEach((m, i) => {
      if (m.spotIndex === i && m.spot) return;
      m.spotIndex = i;
      const crowd = Math.floor(i / n) * 0.22;      // more people than spots: stand a bit apart
      m.spot = room.spots[i % n].add(V3(rand(-0.1, 0.1) + crowd, 0, rand(-0.08, 0.08)));
      m.faceDesk = (inwardOf(d) > 0 ? 0 : Math.PI) + rand(-0.6, 0.6);
      const pos = m.person.root.position;
      if (m === placeNow) {
        pos.copyFrom(m.spot);
        m.person.root.rotation.y = m.lookAt = m.faceDesk;
        m.path = null;
        return;
      }
      setPath(m, asCtrl(roomRoute(room, pos.clone(), m.spot)), m.path ? 0 : rand(0, 0.8));
    });
  }

  // Waiting people walk to their spot if needed, otherwise stand and idle.
  function animateQueues(dt) {
    Object.values(rooms).forEach(room => room.queue.forEach(m => {
      animateMark(m);
      if (m.path) {
        if (followPath(m, dt, m.speed * 0.55)) { m.path = null; m.lookAt = m.faceDesk; }
      } else {
        animateIdle(m, dt);
      }
    }));
  }

  // A cleared message's person walks out of the door and fades away.
  function animateLeaving(dt) {
    for (let i = leaving.length - 1; i >= 0; i--) {
      const m = leaving[i];
      animateMark(m);
      if (m.path && !followPath(m, dt, m.speed * 0.7)) continue;
      m.path = null;
      m.fade -= dt / 0.8;
      animateIdle(m, dt);
      m.person.parts.forEach(p => { p.visibility = Math.max(0, m.fade); });
      if (m.fade <= 0) {
        disposePerson(m);
        leaving.splice(i, 1);
      }
    }
  }

  // Each department clears the front of its queue at its own, slightly irregular pace.
  const nextClear = {};
  DEPARTMENTS.forEach(d => { nextClear[d.id] = d.processEvery * rand(0.3, 1.2); });

  function processQueues(dt) {
    Object.values(rooms).forEach(room => {
      const id = room.dept.id;
      nextClear[id] -= dt;
      if (nextClear[id] > 0) return;
      nextClear[id] = room.dept.processEvery * randIn(WORK_JITTER);
      const done = room.queue.shift();
      if (!done) return;

      // Walk out through the door and fade; the message goes back in the outbox for later.
      const ctrl = asCtrl(roomRoute(room, done.person.root.position.clone(), doorInside(room)));
      ctrl[ctrl.length - 1].hard = true;
      ctrl.push({ p: doorOutside(room), pause: 0, hard: true });
      setPath(done, ctrl, rand(0, 0.4));
      done.fade = 1;
      leaving.push(done);
      outbox.push({ sample: done.sample, readyAt: clock + randIn(RESEND_DELAY) });
      layoutQueue(room);
      refreshRoom(room);
    });
  }

  // Walls glow red when the room is busy, and the open label updates if it's this room.
  function refreshRoom(room) {
    const busy = room.queue.length >= BUSY_THRESHOLD;
    room.wallMat.emissiveColor = busy
      ? BABYLON.Color3.FromHexString(COLORS.busy).scale(0.5)
      : room.baseColor.scale(0.08);
    if (openLabelFor === room.dept.id) renderLabel(room);
  }

  /* =====================================================================
     5. CLICK LABEL — floating panel showing a department's queue.
     ===================================================================== */

  const label = new BABYLON.GUI.Rectangle("queueLabel");
  label.width = "280px";
  label.adaptHeightToChildren = true;
  label.cornerRadius = 10;
  label.thickness = 1;
  label.color = "#34425f";
  label.background = "rgba(15, 20, 32, 0.92)";
  label.linkOffsetY = -110;
  label.isVisible = false;
  ui.addControl(label);

  const labelText = new BABYLON.GUI.TextBlock("queueLabelText");
  labelText.color = "#dfe6f3";
  labelText.fontSize = 13;
  labelText.textWrapping = true;
  labelText.resizeToFit = true;
  labelText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
  labelText.paddingTop = "10px";
  labelText.paddingBottom = "10px";
  labelText.paddingLeft = "12px";
  labelText.paddingRight = "12px";
  label.addControl(labelText);

  let openLabelFor = null;

  function renderLabel(room) {
    const q = room.queue;
    const urgentCount = q.filter(m => m.urgent).length;
    const lines = [
      room.dept.name.toUpperCase(),
      `${q.length} queued` + (urgentCount ? ` · ${urgentCount} urgent` : "") +
        ` · clears 1 every ${room.dept.processEvery}s`,
      "",
    ];
    const item = m => `${m.urgent ? "[URGENT] " : ""}${m.text} — from ${m.from.name}`;

    if (!q.length) lines.push("Nothing waiting.");
    q.slice(0, LABEL_MAX_ITEMS).forEach((m, i) => lines.push(`${i + 1}. ${item(m)}`));
    if (q.length > LABEL_MAX_ITEMS) lines.push(`…and ${q.length - LABEL_MAX_ITEMS} more`);

    // Messages already heading to this department.
    const incoming = travelling.filter(m => m.to.id === room.dept.id);
    if (incoming.length) {
      lines.push("", `ON THE WAY (${incoming.length})`);
      incoming.forEach(m => lines.push(`→ ${item(m)}`));
    }
    labelText.text = lines.join("\n");
  }

  function openLabel(deptId) {
    const room = rooms[deptId];
    openLabelFor = deptId;
    label.linkWithMesh(room.anchor);
    label.color = room.dept.color;
    renderLabel(room);
    label.isVisible = true;
  }

  function closeLabel() {
    openLabelFor = null;
    label.isVisible = false;
  }

  // Click a room to open its label; click empty space to close it.
  // A press that moves more than a few pixels is a camera drag, not a click.
  let downAt = null;
  canvas.addEventListener("pointerdown", e => { downAt = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!downAt) return;
    const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
    downAt = null;
    if (moved > 6) return;

    // Pick only room boxes on visible floors, ignoring everything else.
    const rect = canvas.getBoundingClientRect();
    const hit = scene.pick(e.clientX - rect.left, e.clientY - rect.top,
      mesh => mesh.isEnabled() && !!(mesh.metadata && mesh.metadata.deptId));
    if (hit && hit.hit) openLabel(hit.pickedMesh.metadata.deptId); else closeLabel();
  });
  window.addEventListener("keydown", e => { if (e.key === "Escape") closeLabel(); });

  /* =====================================================================
     6. HUD CONTROLS — floor visibility and pause.
     ===================================================================== */

  function showFloors(which) {
    FLOORS.forEach(f => {
      const on = which === "all" || Number(which) === f.level;
      floorNodes[f.level].setEnabled(on);
      DEPARTMENTS.filter(d => d.floor === f.level).forEach(d => {
        rooms[d.id].nameTag.isVisible = on;
        if (!on && openLabelFor === d.id) closeLabel();
      });
    });
    document.querySelectorAll("#floorButtons button").forEach(b =>
      b.classList.toggle("on", b.dataset.show === which));
  }
  document.querySelectorAll("#floorButtons button").forEach(b =>
    b.addEventListener("click", () => showFloors(b.dataset.show)));

  let paused = false;
  document.getElementById("pauseBtn").addEventListener("click", e => {
    paused = !paused;
    e.target.textContent = paused ? "Play" : "Pause";
  });

  /* =====================================================================
     7. MAIN LOOP
     ===================================================================== */

  seedQueues();

  scene.onBeforeRenderObservable.add(() => {
    if (paused) return;
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.1);   // clamp after tab switches
    clock += dt;
    nextSendIn -= dt;
    if (nextSendIn <= 0) { nextSendIn = randIn(SEND_GAP); spawnMessage(); }
    moveMessages(dt);
    animateQueues(dt);
    animateLeaving(dt);
    processQueues(dt);
  });

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());

  // Handy for poking at the scene from the browser console.
  window.office = { engine, scene, camera, rooms, travelling, leaving, outbox, openLabel, closeLabel };
}

/* =====================================================================
   8. START — wait for Babylon to load, then build the scene.
   ===================================================================== */

loadBabylon()
  .then(startOffice)
  .catch(err => {
    safeLog("error", "[office-3d] Startup failed: " + (err && err.stack || err));
    if (!document.getElementById("startupError").hidden) return;   // a more specific message is already up
    const blocked = /could not be loaded/.test(err.message);
    showStartupError(
      blocked ? "Babylon.js didn't load." : "The 3D view hit an error while starting.",
      blocked
        ? "Every source was blocked or unreachable. Check you're online, that a firewall or ad blocker isn't " +
          "blocking these sites, and that you opened the file in a normal browser tab (some file previews block scripts)."
        : "The message below says what went wrong.",
      err.message);
  });
</script>
</body>
</html>
