<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#08090a;color:#f5f5f7;font-family:"Inter",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
.wrap{width:100%;max-width:340px;text-align:center}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#fff,#a9d8ff);box-shadow:0 0 28px rgba(74,155,237,.3);display:grid;place-items:center;margin:0 auto 26px}
.logo i{width:14px;height:14px;border-radius:50%;border:2.4px solid #0a0a0a}
h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.025em}
p.lead{margin:0 auto;color:#8e8e94;font-size:14px;line-height:1.55}
form{margin-top:30px;text-align:left}
.stack{display:flex;flex-direction:column;gap:12px}
/* pill buttons, like the rest of the sign-in flow */
.pill{width:100%;height:48px;border-radius:999px;border:0;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,transform .1s;background:#1c1c1e;color:#e8e8ea}
.pill:hover{background:#252527}
.pill:active{transform:scale(.99)}
.pill.pri{background:#fff;color:#0a0a0a}
.pill.pri:hover{background:#e6e6e6}
.pill:disabled{opacity:.5;cursor:default}
.pill svg{width:18px;height:18px;flex:none}
.pill .st{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.last{font-size:13px;color:#7c7c82;margin:-2px 0 4px;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:#5c5c62;font-size:12px;margin:22px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
.row{margin-top:14px}
.row:first-child{margin-top:0}
.lbl{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
label{font-size:12.5px;color:#a1a1a8;font-weight:500}
.field{position:relative}
input{width:100%;height:46px;border-radius:12px;background:#1c1c1e;border:1px solid rgba(255,255,255,.07);color:#fff;font:inherit;font-size:14.5px;padding:0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5c5c62}
input:focus{border-color:rgba(255,255,255,.28);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
input[readonly]{color:#a1a1a8}
.field input{padding-right:44px}
.eye{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:9px;background:none;color:#8e8e94;display:grid;place-items:center;cursor:pointer;padding:0}
.eye:hover{color:#fff;background:rgba(255,255,255,.06)}
.eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:#e8e8ea;cursor:pointer;font-weight:500}
.link:hover{color:#fff;text-decoration:underline}
.lbl .link{font-size:12.5px;color:#a9d8ff}
.caps{display:none;font-size:12px;color:#f5c26b;margin-top:7px}
.caps.on{display:block}
#go{margin-top:22px}
.err{color:#ff8a8e;font-size:13px;line-height:1.5;margin-top:14px;text-align:center}
.err:empty{display:none}
.note{font-size:13.5px;color:#c9c9ce;line-height:1.6;background:#141416;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;text-align:left}
.foot{margin-top:26px;font-size:13px;color:#7c7c82;text-align:center;line-height:1.7}
.foot:empty{display:none}
.pin{height:58px;font-size:26px;letter-spacing:.55em;text-align:center;padding:0 0 0 .55em;font-variant-numeric:tabular-nums;border-radius:14px}
.pin::placeholder{letter-spacing:.55em;color:#3a3a40}
.who{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 0;font-size:13.5px;color:#a1a1a8}
.who b{color:#f5f5f7;font-weight:600}
.hint{font-size:12.5px;color:#7c7c82;margin-top:8px;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
 <div class="logo" aria-hidden="true"><i></i></div>
 <h1 id="h">Sign in to Helm</h1>
 <p class="lead" id="lead" hidden></p>
 <form id="f" autocomplete="off" novalidate>
  <div class="note" id="note" hidden></div>
  <div id="fields">
   <div class="row" id="nameRow" hidden><div class="lbl"><label for="name">Your name</label></div><input id="name" autocomplete="name"></div>
   <div class="row" id="emailRow" hidden><div class="lbl"><label for="email">Email</label></div><input id="email" type="email" autocomplete="username" placeholder="you@company.com"></div>
   <div class="row" id="codeRow" hidden><div class="lbl"><label for="code">Setup code</label></div><input id="code" autocomplete="off" spellcheck="false"></div>
   <div class="row" id="pwRow" hidden><div class="lbl"><label for="pw">Password</label></div><input id="pw" type="password" autocomplete="current-password"></div>
   <div class="row" id="pinRow" hidden><div class="lbl"><label for="pin" id="pinLbl">PIN</label></div><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••" aria-describedby="pinHint"><div class="hint" id="pinHint" hidden></div></div>
   <div class="row" id="pin2Row" hidden><div class="lbl"><label for="pin2">Type the PIN again</label></div><input id="pin2" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••"></div>
  </div>
  <button class="pill pri" id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
 </form>
 <div class="foot" id="foot"></div>
</main>
<script>
// Helm opens with a PIN. The workspace owner gives each person a PIN and emails them a one-time link that sets up their
// device. On that device they type the PIN to get in. No passwords, and no reset requests: the owner handles access.
const $=s=>document.querySelector(s);const path=location.pathname,qs=new URLSearchParams(location.search),token=qs.get('t');
let mode='',st={},who={};
const show=(id,on)=>{$(id).hidden=!on};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json','x-helm':'1'},body:JSON.stringify(b||{})}).then(async r=>({r,j:await r.json().catch(()=>({}))}));
const at=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const owner=()=>who.owner||st.owner||'your workspace owner';
function setFoot(items){const f=$('#foot');f.innerHTML='';items.forEach((x,i)=>{if(i)f.append(document.createElement('br'));if(typeof x==='string'){f.append(x);return}const b=document.createElement('button');b.type='button';b.className='link';b.textContent=x[0];b.addEventListener('click',x[1]);f.append(b)})}
function screen(m,o={}){mode=m;$('#err').textContent=o.err||'';$('#h').textContent=o.h;$('#lead').textContent=o.lead||'';show('#lead',!!o.lead);
 show('#note',!!o.note);if(o.note)$('#note').textContent=o.note;
 show('#nameRow',!!o.name);show('#emailRow',!!o.email);show('#codeRow',!!o.code);show('#pwRow',!!o.pw);show('#pinRow',!!o.pin);show('#pin2Row',!!o.pin2);
 $('#pinLbl').textContent=o.pinLabel||'PIN';show('#pinHint',!!o.pinHint);$('#pinHint').textContent=o.pinHint||'';
 show('#go',!!o.go);$('#go').textContent=o.go||'';$('#pin').value='';$('#pin2').value='';setFoot(o.foot||[]);
 const first=['#name','#email','#code','#pw','#pin'].map($).find(i=>!i.closest('[hidden]')&&!i.value);if(first&&o.go)first.focus()}
const RULE='Choose 6 digits that aren’t easy to guess, so not 123456, 111111 or 121212.';
const toNoDevice=err=>screen('nodevice',{h:'Sign in to Helm',err:typeof err==='string'?err:'',note:`Helm only opens on devices your workspace owner has set up. Open the sign-in link ${owner()} emailed you, then enter your PIN.`,foot:[`Lost your PIN or got a new phone? Ask ${owner()}.`,['I’m the workspace owner',toOwnerHelp]]});
const toUnlock=err=>screen('unlock',{h:`Welcome back, ${who.name}`,lead:'Enter your 6-digit PIN.',pin:true,go:'Sign in',err:typeof err==='string'?err:'',foot:[`Forgot your PIN? Ask ${owner()} for a new one.`]});
const toOwnerHelp=()=>screen('ownerhelp',{h:'Workspace owner',note:'Signed in on another device? Open Settings there and choose Add a device. It gives you a link for this one.',foot:[...(st.ownerRecovery?[['Lost every device? Use your setup code',toOwner]]:[]),['Still using a password from before PINs?',toLegacy],['Back',()=>toNoDevice()]]});
const toOwner=()=>screen('owner',{h:'Owner recovery',lead:'Use the setup code you chose when you deployed Helm, then choose a new PIN. Every other device is signed out.',email:true,code:true,pin:true,pin2:true,pinLabel:'New PIN',pinHint:RULE,go:'Set PIN and sign in',foot:[['Back',toOwnerHelp]]});
const toLegacy=()=>screen('legacy',{h:'Sign in with your password',lead:'One last time. You’ll choose a PIN straight after, and the password is deleted.',email:true,pw:true,go:'Sign in',foot:[['Back',toOwnerHelp]]});
async function init(){
 st=await fetch('/api/status').then(r=>r.json()).catch(()=>({}));const err=qs.get('e')||'';
 if(st.setup){screen('setup',{h:'Set up your workspace',lead:'You’re the first person here, so you’re the workspace owner. You give everyone else their access.',name:true,email:true,code:true,pin:true,pin2:true,pinLabel:'Choose your PIN',pinHint:RULE,go:'Create workspace',foot:['The setup code is in the server log when Helm first starts, or it’s the SETUP_CODE you set.']});return}
 if(path==='/join'&&token){const i=await fetch('/api/join/info?t='+encodeURIComponent(token)).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!i){who=await fetch('/api/pin/who').then(r=>r.json()).catch(()=>({}));screen('dead',{h:'Link not found',lead:`This link has expired or was already used. Ask ${owner()} for a new one.`,foot:who.name?[['Sign in on this device',()=>toUnlock()]]:[]});return}
  who=i;screen('join',{h:i.first?`Welcome to Helm, ${i.name}`:`Set up this device, ${i.name}`,lead:`Enter the PIN ${i.owner} gave you. You’ll use it each time you open Helm.`,pin:true,go:i.first?'Join':'Set up and sign in',err});return}
 who=await fetch('/api/pin/who').then(r=>r.json()).catch(()=>({}));
 if(who.name)toUnlock(err);else toNoDevice(err)}
// Six digits typed: sign in straight away on the PIN screens.
$('#pin').addEventListener('input',()=>{const p=$('#pin');p.value=p.value.replace(/\D/g,'').slice(0,6);if(p.value.length===6&&(mode==='unlock'||mode==='join'))$('#f').requestSubmit()});
$('#pin2').addEventListener('input',()=>{const p=$('#pin2');p.value=p.value.replace(/\D/g,'').slice(0,6)});
$('#f').addEventListener('submit',async e=>{e.preventDefault();if(!['setup','unlock','join','owner','legacy'].includes(mode))return;$('#err').textContent='';
 const pin=$('#pin').value,email=$('#email').value.trim();
 if(mode!=='legacy'&&!/^\d{6}$/.test(pin)){$('#err').textContent='Enter all 6 digits.';$('#pin').focus();return}
 if((mode==='setup'||mode==='owner')&&pin!==$('#pin2').value){$('#err').textContent='The two PINs don’t match.';$('#pin2').focus();return}
 if(['setup','owner','legacy'].includes(mode)&&!/^\S+@\S+\.\S+$/.test(email)){$('#err').textContent='Enter your email address.';$('#email').focus();return}
 const api={setup:'/api/setup',unlock:'/api/pin',join:'/api/join',owner:'/api/reset/owner',legacy:'/api/login'}[mode];
 const body={setup:{name:$('#name').value,email,code:$('#code').value,pin},unlock:{pin},join:{token,pin},owner:{email,code:$('#code').value,pin},legacy:{email,password:$('#pw').value}}[mode];
 $('#go').disabled=true;
 try{const {r,j}=await post(api,body);
  if(r.ok){location.href='/';return}
  if(j.noDevice){$('#go').disabled=false;who={owner:who.owner};toNoDevice(j.error);return}
  $('#err').textContent=r.status===429&&j.retryAt?`Too many tries. Try again at ${at(j.retryAt)}.`:(j.error||'Something went wrong. Try again.');
  if(r.status===423){show('#go',false);show('#pinRow',false)}else{$('#pin').value='';$('#pin').focus()}}
 catch(x){$('#err').textContent='Can’t reach Helm. Check your connection.'}
 $('#go').disabled=false});
init();
</script>
</body>
</html>
